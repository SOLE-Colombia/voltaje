<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 960 540"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Pending image placeholder</title>
  <desc id="desc">
    Generic Voltaje-style placeholder shown when the expected screenshot is still missing.
  </desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#17120f" />
      <stop offset="55%" stop-color="#241b17" />
      <stop offset="100%" stop-color="#15110e" />
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2c211d" />
      <stop offset="100%" stop-color="#1d1512" />
    </linearGradient>
    <linearGradient id="frame" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#27bfb8" />
      <stop offset="100%" stop-color="#045da5" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>
  <rect width="960" height="540" rx="40" fill="url(#bg)" />
  <circle cx="154" cy="116" r="118" fill="#045da5" opacity="0.12" />
  <circle cx="822" cy="426" r="138" fill="#27bfb8" opacity="0.1" />
  <path
